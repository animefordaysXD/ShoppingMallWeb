<!DOCTYPE html>
<html lang="ko" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f2e9">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="To Lead의 여성·남성·액세서리 컬렉션을 만나보세요.">
  <title>컬렉션 — To Lead</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Manrope:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600&family=Noto+Serif+KR:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/shop.css">
  <script>document.documentElement.className = document.documentElement.className.replace('no-js', 'js');</script>
</head>
<body data-page="shop">
  <noscript><div class="noscript-note">To Lead 컬렉션을 보려면 JavaScript가 필요합니다.</div></noscript>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-hero" aria-labelledby="collection-title">
      <div class="container-wide">
        <div class="page-hero__grid">
          <div>
            <p class="eyebrow" data-collection-eyebrow>컬렉션</p>
            <h1 class="page-hero__title" id="collection-title" data-collection-title>모든 <em>아이템.</em></h1>
          </div>
          <p class="page-hero__side" data-collection-desc>이번 시즌의 모든 아이템. 함께 입고 오래 간직할 수 있도록 디자인했습니다.</p>
        </div>
        <span class="page-hero__index" aria-hidden="true">03</span>
      </div>
    </section>

    <div class="container-wide">
      <nav class="breadcrumbs" aria-label="현재 위치">
        <a href="index.html">홈</a><span aria-hidden="true">/</span><span aria-current="page">컬렉션</span>
      </nav>

      <section class="catalog" aria-label="상품">
        <div class="catalog__bar">
          <div class="filter-pills" role="group" aria-label="컬렉션 필터">
            <button type="button" data-shop-filter="all">전체</button>
            <button type="button" data-shop-filter="new" data-nav-label="navNew">신상품</button>
            <button type="button" data-shop-filter="women" data-nav-label="navWomen">여성</button>
            <button type="button" data-shop-filter="men" data-nav-label="navMen">남성</button>
            <button type="button" data-shop-filter="accessories" data-nav-label="navAccessories">액세서리</button>
            <button type="button" data-shop-filter="sale">아카이브</button>
          </div>
          <div class="catalog__tools">
            <span class="catalog__count" data-result-count></span>
            <div class="sort-wrap">
              <label for="sort-select">정렬</label>
              <select class="sort-select" id="sort-select">
                <option value="featured">추천순</option>
                <option value="new">신상품순</option>
                <option value="price-asc">가격 낮은순</option>
                <option value="price-desc">가격 높은순</option>
                <option value="name">이름순</option>
              </select>
            </div>
          </div>
        </div>

        <div class="catalog__active" data-active-tags></div>
        <div class="product-grid catalog__grid" id="shop-grid" aria-live="polite"></div>
        <div class="catalog__empty hide" id="shop-empty">
          <p class="eyebrow eyebrow--plain" data-content="shopEmptyEyebrow">아무것도 없습니다</p>
          <h2 data-content="shopEmptyTitle">조건에 맞는 아이템이 없습니다.</h2>
          <p data-content="shopEmptyText">다른 카테고리를 선택하거나 검색어를 지워보세요.</p>
          <button class="btn btn--outline btn--small" type="button" data-shop-reset data-content="shopEmptyCta">전체 상품 보기</button>
        </div>

        <div class="collection-note">
          <p class="eyebrow" data-content="shopNoteEyebrow">의도된 디자인</p>
          <p data-content="shopNoteText">모든 아이템은 한정 수량으로 제작됩니다.</p>
          <a class="link-underline" href="index.html#newsletter" data-content="shopNoteCta">리스트 가입하기 <span aria-hidden="true">→</span></a>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/backend.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/shop.js"></script>
</body>
</html>
