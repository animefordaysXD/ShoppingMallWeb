<!DOCTYPE html>
<html lang="ko" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f2e9">
  <meta name="description" content="To Lead의 아이템을 만나보세요 — 소량으로 제작한 오래 입는 옷.">
  <title>상품 — To Lead</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Manrope:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600&family=Noto+Serif+KR:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/shop.css">
  <link rel="stylesheet" href="assets/css/product.css">
  <script>document.documentElement.className = document.documentElement.className.replace('no-js', 'js');</script>
</head>
<body data-page="product">
  <noscript><div class="noscript-note">To Lead 상품을 보려면 JavaScript가 필요합니다.</div></noscript>
  <div id="site-header"></div>

  <main id="main" class="product-page">
    <div class="container-wide">
      <nav class="breadcrumbs" id="product-breadcrumbs" aria-label="현재 위치"></nav>
      <div id="pdp-root"></div>
      <section class="reviews" id="reviews" aria-labelledby="reviews-title">
        <div class="reviews__grid" id="reviews-root"></div>
      </section>
      <section class="related" id="related" aria-labelledby="related-title">
        <div class="related__head">
          <div>
            <p class="eyebrow" data-content="relatedEyebrow">이어서 둘러보기</p>
            <h2 class="related__title" id="related-title" data-content="relatedTitle">함께 어울리는 아이템.</h2>
          </div>
          <a class="link-underline" href="shop.html" data-content="relatedCta">전체 상품 보기 <span aria-hidden="true">→</span></a>
        </div>
        <div class="product-grid" id="related-grid"></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <div class="mobile-buy" id="mobile-buy" aria-hidden="true">
    <div class="mobile-buy__media"><img id="mobile-buy-image" src="" alt=""></div>
    <div class="mobile-buy__info"><strong id="mobile-buy-name"></strong><span id="mobile-buy-price"></span></div>
    <button class="btn" type="button" id="mobile-buy-add" data-content="pdpAddToBag">쇼핑백에 담기</button>
  </div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/product.js"></script>
</body>
</html>
